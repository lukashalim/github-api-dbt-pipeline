name: dbt CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  run-dbt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-duckdb duckdb requests httpx tenacity

      - name: Run Python Extraction Script
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}  # Optional, but prevents rate-limiting
        run: |
          python scripts/extract_github.py

      - name: Run dbt models
        run: dbt run --target dev

      - name: Run dbt tests
        run: dbt test --target dev